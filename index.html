<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русский язык — интерактивный тренажёр</title>
<style>
  *{ box-sizing: border-box; }
  :root{
    --ink:#1b1833;
    --muted:#6b6a85;
    --primary:#6366f1;
    --primary-2:#8b5cf6;
    --line:#e8e6f4;
    --green:#10b981;
    --red:#f43f5e;
  }
  html,body{ height:100%; }
  body{
    margin:0;
    padding:26px 16px 40px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink);
    background:#f5f5fc;
    background-image:
      radial-gradient(1100px 600px at 8% -12%, #dbeafe 0%, transparent 58%),
      radial-gradient(1000px 620px at 102% -4%, #f5e8ff 0%, transparent 55%),
      radial-gradient(900px 520px at 50% 118%, #d9f7ec 0%, transparent 62%);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100%;
  }
  .card{
    width:100%; max-width:900px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.95);
    border-radius:28px;
    box-shadow:0 30px 70px -34px rgba(43,35,110,.5), 0 1px 0 rgba(255,255,255,.9) inset;
    padding:26px 32px 24px;
    display:flex; flex-direction:column;
    min-height:620px;
    position:relative;
  }
  /* ---------- верхняя панель ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .brand{ font-weight:800; font-size:15px; color:#3b3663; letter-spacing:.2px; }
  .brand i{ font-style:normal; color:var(--primary-2); }
  .counter{
    display:inline-flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums; font-weight:800; font-size:13.5px; color:#6360a0;
    background:#f1f0fb; padding:7px 14px; border-radius:999px; white-space:nowrap;
  }
  .progress{ height:8px; background:#eceafa; border-radius:999px; overflow:hidden; margin-bottom:22px; flex:0 0 auto; }
  .progress > div{
    height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,#6366f1,#a855f7);
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  /* ---------- сцена ---------- */
  #stage{ flex:1 1 auto; }
  .slide{ animation:slideIn .34s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

  /* ---------- титул ---------- */
  .kicker{
    display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.16em;
    text-transform:uppercase; color:#7c3aed; background:#f3e8ff;
    padding:7px 14px; border-radius:999px; margin-bottom:18px;
  }
  .title-slide h1{
    font-size:clamp(25px,4vw,37px); line-height:1.16; letter-spacing:-.02em;
    margin:0 0 14px; font-weight:900;
  }
  .title-slide h1 em{
    font-style:normal;
    background:linear-gradient(120deg,#6366f1,#a855f7 60%,#ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lead{ color:var(--muted); font-size:16.5px; line-height:1.6; margin:0 0 22px; max-width:62ch; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px; }
  .chip{
    font-size:13px; font-weight:700; color:#4c4a6b; background:#f6f5fd;
    border:1px solid #eae8f8; padding:8px 13px; border-radius:11px;
  }

  /* ---------- вопрос ---------- */
  .q-badge{
    display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; color:#6360a0; background:#f1f0fb;
    padding:6px 13px; border-radius:999px; margin-bottom:14px;
  }
  .q-text{
    font-size:clamp(18px,2.4vw,22px); line-height:1.36; letter-spacing:-.01em;
    margin:0 0 20px; font-weight:800;
  }
  .q-intro{ font-size:15.5px; color:var(--muted); line-height:1.55; margin:-8px 0 18px; }
  .passage{
    background:#f7f6ff; border:1.5px dashed #d9d5f6; border-radius:16px;
    padding:15px 17px; font-size:16px; line-height:1.65; color:#3c3a5c;
    margin:0 0 20px;
  }

  /* ---------- варианты ---------- */
  .options{ display:grid; gap:11px; }
  .option{
    display:flex; align-items:center; gap:14px; text-align:left;
    font:inherit; font-size:16.5px; color:var(--ink); line-height:1.4;
    background:#fff; border:1.5px solid var(--line); border-radius:16px;
    padding:14px 17px; cursor:pointer; width:100%;
    transition:border-color .18s, background .18s, transform .12s, box-shadow .18s;
  }
  .option:hover:not(:disabled){ border-color:#c9c5f7; background:#faf9ff; transform:translateY(-1px); }
  .option .marker{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    display:grid; place-items:center; font-size:14px; font-weight:800;
    background:#f1f0fb; color:#6c69a8; transition:.18s;
  }
  .option.selected{ border-color:#8b5cf6; background:#f8f5ff; box-shadow:0 0 0 4px rgba(139,92,246,.13); }
  .option.selected .marker{ background:#8b5cf6; color:#fff; }
  .option.correct{ border-color:#34d399; background:#ecfdf5; }
  .option.correct .marker{ background:#10b981; color:#fff; }
  .option.wrong{ border-color:#fb7185; background:#fff1f2; }
  .option.wrong .marker{ background:#f43f5e; color:#fff; }
  .option.locked:not(.correct):not(.wrong){ opacity:.5; }
  .option:disabled{ cursor:default; }

  /* ---------- поля ввода ---------- */
  .fields{ display:grid; gap:16px; }
  .field-wrap{ display:grid; gap:7px; }
  .field-label{ font-size:13.5px; font-weight:800; color:#5b5880; display:flex; align-items:center; gap:7px; }
  .f-icon{ font-size:13px; font-weight:900; }
  .f-icon.ok{ color:#059669; }
  .f-icon.no{ color:#e11d48; }
  input.field, textarea.field{
    font:inherit; font-size:16px; color:var(--ink); width:100%;
    padding:13px 16px; border-radius:14px; border:1.5px solid var(--line);
    background:#fff; outline:none; resize:vertical; line-height:1.5;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  input.field::placeholder, textarea.field::placeholder{ color:#b3b1c9; }
  input.field:focus, textarea.field:focus{ border-color:#8b5cf6; box-shadow:0 0 0 4px rgba(139,92,246,.14); }
  .field.ok{ border-color:#34d399; background:#f2fdf7; }
  .field.bad{ border-color:#fb7185; background:#fff5f6; }
  .field:disabled{ opacity:1; }

  /* ---------- обратная связь ---------- */
  .feedback{ margin-top:22px; border-radius:16px; padding:15px 18px; animation:slideIn .3s ease both; }
  .feedback.good{ background:#ecfdf5; border:1.5px solid #a7f3d0; }
  .feedback.warn{ background:#fff7ed; border:1.5px solid #fed7aa; }
  .fb-title{ font-weight:900; margin-bottom:6px; font-size:15px; }
  .feedback.good .fb-title{ color:#047857; }
  .feedback.warn .fb-title{ color:#c2410c; }
  .fb-text{ font-size:15px; line-height:1.6; color:#42405e; }

  /* ---------- кнопки ---------- */
  .btn{
    appearance:none; border:0; cursor:pointer; font:inherit; font-weight:800;
    padding:13px 22px; border-radius:14px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s, box-shadow .2s, background .2s, opacity .2s;
  }
  .btn.primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
    box-shadow:0 12px 26px -12px rgba(99,102,241,.95);
  }
  .btn.primary:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 16px 30px -12px rgba(99,102,241,1); }
  .btn.primary:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .btn.ghost{ background:#f3f2fb; color:#4b4869; }
  .btn.ghost:hover:not(:disabled){ background:#e9e7f7; }
  .btn.ghost:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.big{ padding:16px 30px; font-size:16.5px; border-radius:16px; }
  .btn.pulse{ animation:pulse 1.7s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 12px 26px -12px rgba(99,102,241,.95); }
    50%{ box-shadow:0 12px 34px -6px rgba(139,92,246,1); }
  }

  /* ---------- подвал ---------- */
  .footer{
    display:none; gap:10px; align-items:center;
    margin-top:26px; padding-top:20px; border-top:1px solid #f0eefa;
  }
  .footer .grow{ flex:1 1 auto; }

  /* ---------- результаты ---------- */
  .results{ text-align:center; }
  .res-title{ font-size:clamp(22px,3vw,28px); margin:0 0 20px; font-weight:900; }
  .score-ring{
    width:156px; height:156px; border-radius:50%; margin:0 auto 18px;
    background:conic-gradient(#8b5cf6 var(--p), #eceaf8 0);
    position:relative; display:grid; place-items:center;
    transition:background .5s;
  }
  .score-ring::before{ content:""; position:absolute; inset:13px; border-radius:50%; background:#fff; }
  .score-inner{ position:relative; text-align:center; line-height:1.1; }
  .score-num{ font-size:33px; font-weight:900; letter-spacing:-.02em; }
  .score-sub{ font-size:13px; font-weight:800; color:#8b8aa8; margin-top:4px; }
  .res-msg{ font-size:16px; color:var(--muted); line-height:1.55; margin:0 0 22px; }
  .res-list{
    display:grid; gap:8px; text-align:left; max-height:250px; overflow:auto;
    padding-right:4px; margin-bottom:24px;
  }
  .res-row{
    display:flex; align-items:center; gap:11px; padding:10px 14px;
    border-radius:12px; background:#faf9ff; border:1px solid #eeecfa;
    cursor:pointer; font-size:14.5px; transition:background .16s, border-color .16s;
  }
  .res-row:hover{ background:#f3f1ff; border-color:#ded9fa; }
  .res-ico{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    display:grid; place-items:center; font-size:11px; font-weight:900; color:#fff;
  }
  .res-ico.ok{ background:#10b981; }
  .res-ico.no{ background:#f43f5e; }
  .res-num{ font-weight:800; color:#8b8aa8; font-variant-numeric:tabular-nums; }
  .res-txt{ color:#3c3a5c; }

  @media (max-width:640px){
    body{ padding:12px 10px 26px; }
    .card{ padding:20px 17px; border-radius:22px; min-height:auto; }
    .option{ font-size:15.5px; padding:13px 14px; gap:11px; }
    .btn{ padding:12px 16px; font-size:15px; }
    .footer{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="topbar">
    <div class="brand">Русский язык <i>·</i> тренажёр</div>
    <div class="counter" id="counter">1 / 13</div>
  </div>
  <div class="progress"><div id="bar"></div></div>

  <main id="stage"></main>

  <footer class="footer" id="footer">
    <button class="btn ghost" id="prev">← Назад</button>
    <div class="grow"></div>
    <button class="btn primary" id="check">Проверить</button>
    <button class="btn primary" id="next">Далее →</button>
  </footer>
</div>

<script>
/* ============================ ДАННЫЕ ============================ */
const questions = [
  {
    type:'choice',
    text:'По интонации предложения бывают…',
    options:['Восклицательные и невосклицательные','Повествовательные, вопросительные, побудительные'],
    correct:0,
    explain:'По интонации предложения делятся на восклицательные и невосклицательные. А повествовательные, вопросительные и побудительные — это деление по цели высказывания.'
  },
  {
    type:'choice',
    text:'Из чего состоят предложения?',
    options:['Из фраз','Из слогов','Из слов'],
    correct:2,
    explain:'Предложения состоят из слов. Слоги — это части слова, а фразы — более крупные единицы речи.'
  },
  {
    type:'inputs',
    text:'Как называется предложение, состоящее из главных и второстепенных членов?',
    fields:[
      { label:'Твой ответ', placeholder:'Например: …',
        check:v => /распростран/.test(v) }
    ],
    explain:'Предложение, в котором есть и главные, и второстепенные члены, называется распространённым. Если есть только грамматическая основа — нераспространённым.'
  },
  {
    type:'choice',
    text:'Найди простое нераспространённое предложение.',
    options:[
      'Сосновый бор пахнет смолой.',
      'Стройные ели.',
      'Идёт снег.',
      'Кошка играла с котятами, их согревало солнышко.'
    ],
    correct:2,
    explain:'«Идёт снег» — только грамматическая основа, второстепенных членов нет. «Стройные ели» — назывное предложение с определением (распространённое). В остальных есть второстепенные члены, а последнее предложение ещё и сложное.'
  },
  {
    type:'choice',
    text:'Укажи сложное предложение.',
    options:[
      'Природа, друзья, бумага, звезда, крепко, избы.',
      'Дети долго гуляли в сосновом лесу.',
      'Девочки пели весёлую песенку, а мальчики слушали их.',
      'Журавли, стрижи, ласточки улетели на юг.'
    ],
    correct:2,
    explain:'«Девочки пели весёлую песенку, а мальчики слушали их» — две грамматические основы: девочки пели и мальчики слушали. Остальные записи — простое предложение или перечень слов.'
  },
  {
    type:'choice',
    text:'Прочитай предложение: «На берёзе распустились клейкие листочки».',
    intro:'Каким членом предложения в нём является слово «распустились»?',
    options:['Второстепенным членом','Подлежащим','Сказуемым'],
    correct:2,
    explain:'Подлежащее — листочки (кто? что?). Слово «распустились» отвечает на вопрос «что сделали?» — это сказуемое.'
  },
  {
    type:'choice',
    text:'Сколько предложений в тексте?',
    passage:'Рядом со школой построили детский сад в нём три группы детей ребята из школы часто ходят туда малыши ждут своих друзей.',
    options:['3','4','5'],
    correct:1,
    explain:'Получается 4 предложения: «Рядом со школой построили детский сад. В нём три группы детей. Ребята из школы часто ходят туда. Малыши ждут своих друзей.»'
  },
  {
    type:'choice',
    text:'Что такое словосочетание?',
    options:[
      'Два любых слова',
      'Два слова, связанных по смыслу',
      'Подлежащее и сказуемое',
      'Второстепенные члены предложения'
    ],
    correct:1,
    explain:'Словосочетание — это два (или больше) слова, связанных по смыслу и грамматически, где одно слово главное, а другое зависимое. Подлежащее и сказуемое — это грамматическая основа, а не словосочетание.'
  },
  {
    type:'choice',
    text:'Какая запись не является словосочетанием?',
    options:['прекрасная музыка','туман над лесом','ребята играют','под голубыми небесами'],
    correct:2,
    explain:'«Ребята играют» — это грамматическая основа (подлежащее + сказуемое), а не словосочетание.'
  },
  {
    type:'inputs',
    text:'На ветке дерева висела кормушка.',
    intro:'Подчеркни грамматическую основу и выпиши словосочетания с вопросами.',
    fields:[
      { label:'Грамматическая основа', placeholder:'подлежащее + сказуемое',
        check:v => v.includes('кормушка') && v.includes('висела') },
      { label:'Словосочетания с вопросами', placeholder:'Каждое словосочетание — с новой строки', multiline:true,
        check:v => v.includes('висела') && v.includes('ветке') && v.includes('дерева') }
    ],
    explain:'Грамматическая основа: кормушка висела. Словосочетания: висела (на чём?) на ветке; на ветке (чего?) дерева. «Кормушка висела» — грамматическая основа, словосочетанием не является.'
  },
  {
    type:'choice',
    text:'Из перечисленных слов выбери лишнее:',
    options:['нос','носик','носатый','носильщик'],
    correct:3,
    explain:'«Носильщик» — от слова «носить». А «нос», «носик», «носатый» — однокоренные слова со значением «нос».'
  },
  {
    type:'inputs',
    text:'Закончи правило о корне слова.',
    fields:[
      { label:'Корень — это …', placeholder:'…',
        check:v => v.includes('часть слова') || (v.includes('главн') && v.includes('значим')) },
      { label:'В корне заключено …', placeholder:'…',
        check:v => v.includes('значени') },
      { label:'Корень в однокоренных словах обычно пишется …', placeholder:'…',
        check:v => v.includes('одинаков') }
    ],
    explain:'Корень — это главная значимая часть слова. В корне заключено общее лексическое значение всех однокоренных слов. Корень в однокоренных словах обычно пишется одинаково.'
  },
  {
    type:'inputs',
    text:'Сделай звуко-буквенный анализ слова «пень».',
    intro:'Заполни числовые данные, а затем сверься с разбором.',
    fields:[
      { label:'Сколько слогов?', placeholder:'цифра',
        check:v => /(^|\s)1(\s|$)/.test(v) },
      { label:'Сколько букв?', placeholder:'цифра',
        check:v => /(^|\s)4(\s|$)/.test(v) },
      { label:'Сколько звуков?', placeholder:'цифра',
        check:v => /(^|\s)3(\s|$)/.test(v) }
    ],
    explain:'пень — 1 слог, 4 буквы, 3 звука. [п’эн’]: п — [п’] согласный, глухой парный, мягкий парный; е — [э] гласный, ударный; н — [н’] согласный, звонкий непарный (сонорный), мягкий парный; ь — звука не обозначает.'
  }
];

/* ============================ СОСТОЯНИЕ ============================ */
const state = questions.map(() => ({ selected:null, values:[], fields:[], checked:false, correct:false }));
let cur = 0; // 0 — титул, 1..13 — вопросы, 14 — результаты

const stage      = document.getElementById('stage');
const footer     = document.getElementById('footer');
const bar        = document.getElementById('bar');
const counter    = document.getElementById('counter');
const btnPrev    = document.getElementById('prev');
const btnCheck   = document.getElementById('check');
const btnNext    = document.getElementById('next');

/* ============================ УТИЛИТЫ ============================ */
function norm(s){
  return String(s || '')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[.,;:!?"'«»()\[\]\-—–\/\\]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function canCheck(q, st){
  if (st.checked) return false;
  if (q.type === 'choice') return st.selected !== null;
  return q.fields.some((f,i) => String(st.values[i] || '').trim().length > 0);
}
function shortText(q){
  const t = q.text.replace(/\s+/g,' ');
  return t.length > 72 ? t.slice(0,72) + '…' : t;
}

/* ============================ ШАБЛОНЫ ============================ */
function titleHTML(){
  return `<div class="slide title-slide">
    <div class="kicker">Интерактивный тренажёр</div>
    <h1>Предложение, словосочетание,<br><em>корень слова</em></h1>
    <p class="lead">13 заданий по русскому языку. Выбирай варианты ответа или вводи свой ответ с клавиатуры — программа сразу проверит и объяснит правило.</p>
    <div class="chips">
      <span class="chip">Виды предложений</span>
      <span class="chip">Грамматическая основа</span>
      <span class="chip">Словосочетание</span>
      <span class="chip">Однокоренные слова</span>
      <span class="chip">Звуко-буквенный анализ</span>
    </div>
    <button class="btn primary big" id="startBtn">Начать →</button>
  </div>`;
}

function questionHTML(qi){
  const q  = questions[qi];
  const st = state[qi];
  let body = '';

  if (q.type === 'choice'){
    body = `<div class="options">` + q.options.map((o,i) => {
      let cls = 'option';
      if (st.checked){
        cls += ' locked';
        if (i === q.correct) cls += ' correct';
        else if (i === st.selected) cls += ' wrong';
      } else if (st.selected === i) cls += ' selected';
      return `<button class="${cls}" data-opt="${i}" ${st.checked ? 'disabled' : ''}>
        <span class="marker">${i + 1}</span>
        <span class="opt-text">${escapeHtml(o)}</span>
      </button>`;
    }).join('') + `</div>`;
  } else {
    body = `<div class="fields">` + q.fields.map((f,i) => {
      const val = st.values[i] || '';
      const ok  = st.checked ? !!st.fields[i] : null;
      let cls = 'field';
      if (st.checked) cls += ok ? ' ok' : ' bad';
      const icon = st.checked ? `<span class="f-icon ${ok ? 'ok' : 'no'}">${ok ? '✔' : '✘'}</span>` : '';
      const input = f.multiline
        ? `<textarea class="${cls}" data-field="${i}" rows="3" placeholder="${escapeHtml(f.placeholder || '')}" ${st.checked ? 'disabled' : ''}>${escapeHtml(val)}</textarea>`
        : `<input class="${cls}" data-field="${i}" placeholder="${escapeHtml(f.placeholder || '')}" value="${escapeHtml(val)}" ${st.checked ? 'disabled' : ''} autocomplete="off">`;
      return `<label class="field-wrap">
        <span class="field-label">${escapeHtml(f.label)} ${icon}</span>
        ${input}
      </label>`;
    }).join('') + `</div>`;
  }

  const intro   = q.intro   ? `<p class="q-intro">${escapeHtml(q.intro)}</p>` : '';
  const passage = q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : '';

  let fb = '';
  if (st.checked){
    const partial = q.type === 'inputs' && st.fields.some(Boolean) && !st.correct;
    const cls   = st.correct ? 'good' : 'warn';
    const title = st.correct ? '✔ Верно!' : (partial ? '✘ Почти получилось' : '✘ Не совсем');
    fb = `<div class="feedback ${cls}">
      <div class="fb-title">${title}</div>
      <div class="fb-text">${escapeHtml(q.explain)}</div>
    </div>`;
  }

  return `<div class="slide">
    <div class="q-badge">Вопрос ${qi + 1} из ${questions.length}</div>
    <h2 class="q-text">${escapeHtml(q.text)}</h2>
    ${intro}
    ${passage}
    ${body}
    ${fb}
  </div>`;
}

function resultsHTML(){
  const total   = questions.length;
  const correct = state.filter(s => s.correct).length;
  const pct     = Math.round(correct / total * 100);

  let msg;
  if (pct >= 90)      msg = 'Великолепно! Тема освоена отлично 🎉';
  else if (pct >= 70) msg = 'Хороший результат! Осталось повторить пару мелочей.';
  else if (pct >= 50) msg = 'Неплохо, но некоторые правила стоит повторить.';
  else                msg = 'Не расстраивайся — повтори тему и попробуй ещё раз!';

  const rows = questions.map((q,i) => {
    const st = state[i];
    return `<div class="res-row" data-goto="${i}">
      <span class="res-ico ${st.correct ? 'ok' : 'no'}">${st.correct ? '✔' : '✘'}</span>
      <span class="res-num">${i + 1}.</span>
      <span class="res-txt">${escapeHtml(shortText(q))}</span>
    </div>`;
  }).join('');

  return `<div class="slide results">
    <h2 class="res-title">Готово!</h2>
    <div class="score-ring" style="--p:${pct}%">
      <div class="score-inner">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}%</div>
      </div>
    </div>
    <p class="res-msg">${msg}<br>Нажми на строку ниже, чтобы вернуться к любому вопросу и посмотреть разбор.</p>
    <div class="res-list">${rows}</div>
    <button class="btn primary big" id="againBtn">Пройти заново ↻</button>
  </div>`;
}

/* ============================ РЕНДЕР ============================ */
function render(){
  const isTitle   = cur === 0;
  const isResults = cur === questions.length + 1;
  const qi        = cur - 1;

  let p = 0;
  if (cur >= 1 && cur <= questions.length) p = (cur / questions.length) * 100;
  if (isResults) p = 100;
  bar.style.width = p + '%';

  counter.style.display = isTitle ? 'none' : 'inline-flex';
  counter.textContent = isResults
    ? `${questions.length} / ${questions.length}`
    : `${Math.max(cur, 0)} / ${questions.length}`;

  if (isTitle){
    stage.innerHTML = titleHTML();
    footer.style.display = 'none';
  } else if (isResults){
    stage.innerHTML = resultsHTML();
    footer.style.display = 'none';
  } else {
    stage.innerHTML = questionHTML(qi);
    footer.style.display = 'flex';

    const st = state[qi];
    btnPrev.disabled = false;
    btnCheck.style.display = st.checked ? 'none' : 'inline-flex';
    btnCheck.disabled = !canCheck(questions[qi], st);
    btnNext.textContent = cur === questions.length ? 'Показать результат →' : 'Далее →';
    btnNext.classList.toggle('pulse', st.checked);
  }
  stage.scrollTop = 0;
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============================ СОБЫТИЯ ============================ */
stage.addEventListener('click', (e) => {
  const opt = e.target.closest('.option');
  if (opt && !opt.disabled){
    const st = state[cur - 1];
    if (!st.checked){
      st.selected = Number(opt.dataset.opt);
      render();
    }
    return;
  }
  if (e.target.closest('#startBtn')){ cur = 1; render(); return; }
  if (e.target.closest('#againBtn')){ resetAll(); return; }
  const row = e.target.closest('.res-row');
  if (row){ cur = Number(row.dataset.goto) + 1; render(); return; }
});

stage.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.field !== undefined && cur >= 1 && cur <= questions.length){
    state[cur - 1].values[Number(t.dataset.field)] = t.value;
    btnCheck.disabled = !canCheck(questions[cur - 1], state[cur - 1]);
  }
});

btnCheck.addEventListener('click', () => {
  const qi = cur - 1;
  if (qi < 0 || qi >= questions.length) return;
  const q  = questions[qi];
  const st = state[qi];
  if (st.checked) return;

  if (q.type === 'choice'){
    if (st.selected === null) return;
    st.correct = st.selected === q.correct;
    st.fields  = [];
  } else {
    st.fields  = q.fields.map((f,i) => f.check(norm(st.values[i] || '')));
    st.correct = st.fields.every(Boolean);
  }
  st.checked = true;
  render();
});

btnPrev.addEventListener('click', () => {
  if (cur > 0){ cur--; render(); }
});

btnNext.addEventListener('click', () => {
  if (cur < questions.length){ cur++; render(); }
  else { cur = questions.length + 1; render(); }
});

function resetAll(){
  state.forEach(st => { st.selected = null; st.values = []; st.fields = []; st.checked = false; st.correct = false; });
  cur = 0;
  render();
}

/* ============================ СТАРТ ============================ */
render();
</script>
</body>
</html>
